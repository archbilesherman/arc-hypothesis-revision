
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-hypothesis-revision"
version = "0.1.0"
description = "Persistent hypothesis revision for ARC"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
